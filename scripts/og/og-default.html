<!doctype html>
<!--
  Source of public/og-default.png (1200×630). Regenerate after editing (or after adding the
  logo files — uncomment the <img> tags below) by opening this file in Chrome at 1200×630 and
  taking a screenshot, or: see README "OG зураг".
-->
<html lang="mn">
  <head>
    <meta charset="utf-8" />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Nunito+Sans:wght@600&display=block&subset=cyrillic"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        font-family: "Nunito Sans", Arial, sans-serif;
        background: #ffffff;
        color: #1f2937;
        position: relative;
      }
      .blob {
        position: absolute;
        border-radius: 9999px;
        filter: blur(60px);
        opacity: 0.35;
      }
      .stripe {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 18px;
        display: flex;
      }
      .stripe span {
        flex: 1;
      }
      .wrap {
        position: absolute;
        inset: 0;
        padding: 80px 90px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .eyebrow {
        display: inline-block;
        align-self: flex-start;
        background: #e3f4fb;
        color: #00749e;
        font-weight: 600;
        font-size: 26px;
        padding: 10px 22px;
        border-radius: 999px;
      }
      h1 {
        font-family: Montserrat, Arial, sans-serif;
        font-weight: 800;
        font-size: 92px;
        line-height: 1.05;
        margin: 28px 0 18px;
        letter-spacing: -1px;
      }
      p {
        font-size: 34px;
        margin: 0;
        color: #4b5563;
        max-width: 900px;
      }
      .logos {
        position: absolute;
        top: 70px;
        right: 90px;
        display: flex;
        gap: 18px;
        align-items: center;
      }
      .logos img {
        height: 110px;
      }
    </style>
  </head>
  <body>
    <div
      class="blob"
      style="width: 520px; height: 520px; left: -160px; top: -200px; background: #1cabe2"
    ></div>
    <div
      class="blob"
      style="width: 460px; height: 460px; right: -120px; top: 40px; background: #8e4fc6"
    ></div>
    <div
      class="blob"
      style="width: 380px; height: 380px; right: 300px; bottom: -220px; background: #f5b301"
    ></div>
    <!-- <div class="logos"><img src="../../public/logos/school-130.png" /><b>×</b><img src="../../public/logos/unicef.png" /></div> -->
    <div class="wrap">
      <span class="eyebrow">130-р сургууль × UNICEF</span>
      <h1>130 UNICEF клуб</h1>
      <p>
        Хүүхэд бүрийн төлөө, хамтдаа! Сургууль дотор болон гадна хүүхдүүдэд тусалдаг сурагчдын клуб.
      </p>
    </div>
    <div class="stripe">
      <span style="background: #1cabe2"></span><span style="background: #8e4fc6"></span
      ><span style="background: #4cb847"></span><span style="background: #2f7ed8"></span
      ><span style="background: #f5b301"></span>
    </div>
  </body>
</html>
